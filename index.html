<html lang="en-GB">
<head>

<title>Revision Tracker</title>

<style>
/* Layout: one subject at a time. Coloured subject chips on top, papers as sections, each topic a tap-to-cycle row. */
:root{
 --bg:#eceff6;--surface:#ffffff;--raised:#f4f6fb;--ink:#141a2e;--mute:#566077;--line:#dce1ec;
 --on:#ffffff;--none:#bcc4d4;
 --rev:#d97706;--rev-t:#a85a05;--on-rev:#2b1600;
 --ok:#15803d;--ok-t:#15803d;--on-ok:#ffffff;
 --c0:#c2410c;--c1:#a21caf;--c2:#1d4ed8;--c3:#15803d;--c4:#0f766e;--c5:#5b3fd6;--c6:#be123c;--c7:#a16207;--c8:#92400e;
 --f-head:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
 --f-body:"DM Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0e1322;--surface:#161d33;--raised:#1c2440;--ink:#e9edf8;--mute:#98a3bb;--line:#2a3452;
 --on:#0b1020;--none:#4a5674;
 --rev:#fbbf24;--rev-t:#fbbf24;--on-rev:#2b1600;
 --ok:#4ade80;--ok-t:#4ade80;--on-ok:#052e16;
 --c0:#fb923c;--c1:#e879f9;--c2:#7aa7ff;--c3:#4ade80;--c4:#2dd4bf;--c5:#a78bfa;--c6:#fb7185;--c7:#facc15;--c8:#d6a272;
 color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0e1322;--surface:#161d33;--raised:#1c2440;--ink:#e9edf8;--mute:#98a3bb;--line:#2a3452;
 --on:#0b1020;--none:#4a5674;
 --rev:#fbbf24;--rev-t:#fbbf24;--on-rev:#2b1600;
 --ok:#4ade80;--ok-t:#4ade80;--on-ok:#052e16;
 --c0:#fb923c;--c1:#e879f9;--c2:#7aa7ff;--c3:#4ade80;--c4:#2dd4bf;--c5:#a78bfa;--c6:#fb7185;--c7:#facc15;--c8:#d6a272;
 color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:680px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font:700 1.7rem/1.05 var(--f-head);margin:0;letter-spacing:-.015em}
.tot{font-size:.85rem;color:var(--mute);text-align:right;white-space:nowrap}
.tot b{color:var(--ink);font-size:1.05rem;font-variant-numeric:tabular-nums}
.tbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font:600 .9rem var(--f-body)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.chip small{font-weight:500;color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums}
.chip.on{background:var(--sc);border-color:var(--sc);color:var(--on)}
.chip.on .dot{background:var(--on)}
.chip.on small{color:var(--on);opacity:.85}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:.86rem;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--sc);color:var(--on)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.86rem;font-weight:500}
.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srcd{font-size:.84rem;color:var(--mute)}
.srcd summary{padding:6px 0;cursor:pointer}
.srcd p{margin:2px 0 8px;max-width:62ch}
.ph{font:700 .98rem var(--f-head);color:var(--sc);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px}
.card h3{font:700 1.05rem/1.25 var(--f-head);margin:0}
.meta{font-size:.82rem;color:var(--mute);margin-top:2px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--sc);border-radius:3px}
.empty{padding:10px 0;font-size:.88rem;color:var(--mute)}
.grp{font-weight:600;font-size:.82rem;margin:12px 0 2px;color:var(--mute)}
.row{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line)}
.rm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 0;text-align:left;border-radius:8px}
.rm .t{flex:1;min-width:0;overflow-wrap:anywhere}
.mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--none);display:grid;place-items:center;font:700 .8rem/1 var(--f-body)}
.mk.g1{background:var(--rev);border-color:var(--rev);color:var(--on-rev)}
.mk.g3{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.n{flex:none;font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums}
.lab{flex:none;font-size:.78rem;font-weight:600}
.lab.g1{color:var(--rev-t)}.lab.g3{color:var(--ok-t)}
.ic{flex:none;width:32px;height:36px;border:0;background:none;color:var(--mute);border-radius:8px;font-size:1rem;display:grid;place-items:center}
.ic:hover{background:var(--raised)}
.sp .rm{padding:8px 0 8px 34px;font-size:.92rem;color:var(--mute)}
.sp .mk{width:20px;height:20px;font-size:.7rem}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raised);margin:0 0 10px;resize:vertical}
.add{display:flex;gap:8px;padding:10px 0 4px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.add button{border:0;border-radius:10px;background:var(--sc);color:var(--on);font-weight:600;padding:0 18px}
.small{font-size:.8rem;color:var(--mute);margin-top:14px}
.rs{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0;font-size:.8rem}
#bk{max-width:680px;margin:18px auto 0;font-size:.86rem;color:var(--mute)}#bk summary{cursor:pointer;padding:8px 0}.bkb{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.bkb button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}#bk textarea{margin-top:4px}
</style>

</head>

const $=s=>document.querySelector(s);
let S={s:{},c:{},n:{},h:{}},store=null,mode='device',tmr,cur=SUB.findIndex(s=>s.n==='Geography'),lvl='topics',hide=false,open=null,fresh=false;
const LB=['Not marked','Revise','','Solid'];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=(s,p,t)=>s+'|'+p+'|'+t;
const st=k=>{const v=(S.s[k]||[0])[0];return v===3?3:v?1:0};
function topics(s,p,all){const m=new Map(),cu=S.c[s.n+'|'+p.n]||[];
 p.i.concat(cu).forEach(x=>{const z=x.indexOf(' \u203a '),t=(z>0?x.slice(0,z):x).replace(' (if studied)','');if(!m.has(t))m.set(t,[]);if(z>0&&!m.get(t).includes(x.slice(z+3)))m.get(t).push(x.slice(z+3))});
 const r=[...m].map(([t,d])=>({t,d,c:cu.includes(t),cp:d.filter(x=>cu.includes(t+' \u203a '+x))}));
 return all?r:r.filter(x=>!S.h[K(s.n,p.n,x.t)])}
function tst(sn,pn,t){if(!t.d.length)return st(K(sn,pn,t.t));const v=t.d.map(x=>st(K(sn,pn,t.t)+'#'+x));return v.every(x=>x===3)?3:v.some(x=>x)?1:0}
function save(){clearTimeout(tmr);tmr=setTimeout(async()=>{const j=JSON.stringify(S);try{localStorage.setItem('rt3',j)}catch(e){}},400)}
function load(o){if(o&&typeof o==='object'){S.s=o.s||{};S.c=o.c||{};S.n=o.n||{};S.h=o.h||{}}}
function init(){
 try{const r=localStorage.getItem('rt3');if(r)load(JSON.parse(r))}catch(e){}
 render()}
function addTopic(v){const s=SUB[cur],i=$('#at'+v);if(!i)return;const t=(i.value||'').trim().replace(/\s*>\s*/,' › ');if(!t)return;const key=s.n+'|'+s.p[v].n;(S.c[key]=S.c[key]||[]).push(t);i.value='';save();render()}
function render(){
 const s=SUB[cur],lit=s.n==='English Literature';
 const keep={};if(!fresh)document.querySelectorAll('input[id^="at"]').forEach(i=>{if(i.value)keep[i.id]=i.value});fresh=false;
 let TA=0,TG=0;
 const chips=SUB.map((x,i)=>{let a=0,g=0;x.p.forEach(p=>topics(x,p).forEach(t=>{a++;if(tst(x.n,p.n,t)===3)g++}));TA+=a;TG+=g;
  return '<button class="chip'+(i===cur?' on':'')+'" style="--sc:var(--c'+i+')" data-a="sub" data-v="'+i+'"><span class="dot"></span>'+esc(x.n)+'<small>'+g+'/'+a+'</small></button>'}).join('');
 let o='<div class="wrap" style="--sc:var(--c'+cur+')"><div class="head"><h1>Revision</h1><div class="tot"><b>'+TG+'</b> of '+TA+' solid</div></div><div class="tbar"><i style="width:'+(TA?TG/TA*100:0)+'%"></i></div><div class="chips">'+chips+'</div>';
 o+='<div class="ctl"><div class="seg"><button class="'+(lvl==='topics'?'on':'')+'" data-a="lvl" data-v="topics">Topics only</button><button class="'+(lvl==='points'?'on':'')+'" data-a="lvl" data-v="points">'+(lit?'With quotes':'With spec points')+'</button></div><button class="tog'+(hide?' on':'')+'" data-a="hide">Hide solid</button></div><details class="srcd"><summary>Where this content comes from</summary><p>'+esc(s.src)+'</p></details>';
 let lh='',nh=0;
 s.p.forEach((p,pi)=>{const T=topics(s,p);nh+=topics(s,p,true).length-T.length;let g=0,rows='';
  if(p.h&&p.h!==lh){lh=p.h;o+='<h2 class="ph">'+esc(p.h)+'</h2>'}
  T.forEach(t=>{const v=tst(s.n,p.n,t);if(v===3)g++;if(hide&&v===3)return;const k=K(s.n,p.n,t.t);
   const cnt=t.d.length?t.d.filter(x=>st(k+'#'+x)===3).length+'/'+t.d.length:'';
   rows+='<div class="row"><button class="rm" data-a="tt" data-p="'+pi+'" data-t="'+esc(t.t)+'" aria-label="'+esc(t.t)+': '+LB[v]+'. Tap to change"><span class="mk g'+v+'">'+(v===3?'✓':v===1?'!':'')+'</span><span class="t">'+esc(t.t)+'</span><span class="n">'+cnt+'</span></button><button class="ic" data-a="nt" data-k="'+esc(k)+'" aria-label="Notes">✎'+(S.n[k]?'•':'')+'</button><button class="ic" data-a="'+(t.c?'td':'th')+'" data-p="'+pi+'" data-t="'+esc(t.t)+'" aria-label="'+(t.c?'Remove':'Hide, not studying this')+'">✕</button></div>';
   if(lvl==='points')t.d.forEach(x=>{const pk=k+'#'+x,pv=st(pk);if(hide&&pv===3)return;rows+='<div class="row sp"><button class="rm" data-a="tp" data-k="'+esc(pk)+'" aria-label="'+esc(x)+': '+LB[pv]+'. Tap to change"><span class="mk g'+pv+'">'+(pv===3?'✓':pv===1?'!':'')+'</span><span class="t">'+esc(x)+'</span></button>'+(t.cp.includes(x)?'<button class="ic" data-a="pd" data-p="'+pi+'" data-t="'+esc(t.t)+'" data-x="'+esc(x)+'" aria-label="Remove">✕</button>':'')+'</div>'});
   if(open===k)rows+='<textarea rows="3" data-a="sn" data-k="'+esc(k)+'" aria-label="Notes" placeholder="'+(lit?'Where it is, key word or technique, themes, context':'Case studies, what to fix, anything to remember')+'">'+esc(S.n[k]||'')+'</textarea>'});
  o+='<div class="card"><h3>'+esc(p.n)+'</h3><div class="meta">'+g+' of '+T.length+' '+(p.u||'topics solid')+(p.tg?' · aim for '+p.tg:'')+'</div><div class="bar"><i style="width:'+(T.length?g/T.length*100:0)+'%"></i></div>'+(rows||(T.length?'':'<div class="empty">Nothing added yet.</div>'))+'<form class="add" data-v="'+pi+'"><input type="text" id="at'+pi+'" aria-label="Add" autocomplete="off" enterkeyhint="done" placeholder="'+esc(p.ph||'Add a topic')+'"><button type="submit">Add</button></form></div>'});
 if(nh)o+='<p class="small">'+nh+' hidden in this subject. <button class="rs" data-a="unh">Show them again</button></p>';
 o+='<p class="small">Tap a topic to change it: Not marked, Revise, Solid. The cross hides a topic you are not studying. '+'Saved on this phone only. Use Backup below.'+'</p></div>';
 $('#app').innerHTML=o;
 const on=document.querySelector('.chip.on'),cs=document.querySelector('.chips');if(on&&cs)cs.scrollLeft=on.offsetLeft-(cs.clientWidth-on.offsetWidth)/2;
 Object.keys(keep).forEach(id=>{const i=document.getElementById(id);if(i)i.value=keep[id]})}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f&&f.dataset&&f.dataset.v!==undefined)addTopic(+f.dataset.v)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,k=b.dataset.k,s=SUB[cur],p=s.p[+b.dataset.p];
 if(a==='sub'){cur=+v;open=null;fresh=true}
 else if(a==='lvl'){lvl=v}
 else if(a==='hide'){hide=!hide}
 else if(a==='tp'){S.s[k]=[{0:1,1:3,3:0}[st(k)]]}
 else if(a==='tt'){const t=topics(s,p).find(x=>x.t===b.dataset.t);if(!t)return;const nv={0:1,1:3,3:0}[tst(s.n,p.n,t)],kk=K(s.n,p.n,t.t);if(t.d.length)t.d.forEach(x=>{S.s[kk+'#'+x]=[nv]});else S.s[kk]=[nv]}
 else if(a==='nt'){open=open===k?null:k}
 else if(a==='td'){const key=s.n+'|'+p.n;S.c[key]=(S.c[key]||[]).filter(x=>x!==b.dataset.t)}
 else if(a==='th'){S.h[K(s.n,p.n,b.dataset.t)]=1}
 else if(a==='pd'){const key=s.n+'|'+p.n;S.c[key]=(S.c[key]||[]).filter(x=>x!==b.dataset.t+' › '+b.dataset.x)}
 else if(a==='unh'){Object.keys(S.h).forEach(x=>{if(x.indexOf(s.n+'|')===0)delete S.h[x]})}
 else return;save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='sn'){S.n[t.dataset.k]=t.value;save()}});
init();render();
</script>
